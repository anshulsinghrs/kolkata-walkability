name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual triggering from the Actions tab
  workflow_dispatch:

# Required permissions for the official Pages action
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy can run at a time; cancel any in-flight deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        # Uploads only the frontend folder — backend scripts and docs stay private
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
